<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932" role="img" aria-label="Moonlit frozen lake world">
  <defs>
    <linearGradient id="lake-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071227"/>
      <stop offset="0.46" stop-color="#17335b"/>
      <stop offset="1" stop-color="#0a607f"/>
    </linearGradient>
    <radialGradient id="lake-moon" cx="42%" cy="38%" r="58%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.56" stop-color="#ffda8b"/>
      <stop offset="1" stop-color="#ffb65c"/>
    </radialGradient>
    <linearGradient id="lake-water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5577"/>
      <stop offset="0.52" stop-color="#073953"/>
      <stop offset="1" stop-color="#031a34"/>
    </linearGradient>
    <linearGradient id="lake-ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.34" stop-color="#83eaff"/>
      <stop offset="1" stop-color="#13739c"/>
    </linearGradient>
    <linearGradient id="lake-cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42698a"/>
      <stop offset="0.55" stop-color="#173d60"/>
      <stop offset="1" stop-color="#09263f"/>
    </linearGradient>
    <linearGradient id="lake-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#cdefff"/>
      <stop offset="1" stop-color="#76b9d6"/>
    </linearGradient>
    <linearGradient id="lake-cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c4328"/>
      <stop offset="1" stop-color="#301b24"/>
    </linearGradient>
    <radialGradient id="lake-lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbd0"/>
      <stop offset="0.42" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff8a2d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lake-vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0.48" stop-color="#001628" stop-opacity="0"/>
      <stop offset="1" stop-color="#010813" stop-opacity="0.72"/>
    </radialGradient>
    <symbol id="lake-pine" viewBox="0 0 34 88">
      <path d="M16 4 5 26h7L2 45h10L0 68h32L21 45h10L21 26h7Z" fill="#0a2b41"/>
      <path d="M16 4 10 26h5L8 45h7L7 67h9Z" fill="#e6f8ff" opacity=".84"/>
      <path d="M14 68h6v20h-6z" fill="#472e29"/>
    </symbol>
  </defs>

  <rect width="430" height="932" fill="url(#lake-sky)"/>
  <path d="M-18 186Q215-45 448 186" fill="none" stroke="#b7eaff" stroke-opacity=".32" stroke-width="7"/>
  <path d="M4 164Q215-27 426 164" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="247" cy="135" r="56" fill="url(#lake-moon)" opacity=".94"/>
  <circle cx="266" cy="119" r="57" fill="#112b50" opacity=".74"/>
  <g fill="#d9f5ff" opacity=".9">
    <circle cx="29" cy="92" r="1.5"/><circle cx="63" cy="53" r="1"/><circle cx="105" cy="118" r="1.8"/>
    <circle cx="156" cy="59" r="1.3"/><circle cx="190" cy="149" r="1"/><circle cx="316" cy="62" r="1.4"/>
    <circle cx="365" cy="112" r="1.1"/><circle cx="402" cy="57" r="1.7"/><circle cx="336" cy="168" r="1"/>
  </g>
  <g fill="#a7c8df" opacity=".7">
    <path d="M0 255 42 191 77 238 116 176 166 249Z"/>
    <path d="M242 248 294 171 335 231 365 186 430 253Z"/>
  </g>
  <path d="M0 256Q65 224 132 250T257 246T430 258V410H0Z" fill="#183a57"/>
  <g opacity=".76">
    <use href="#lake-pine" x="3" y="174" width="42" height="108"/>
    <use href="#lake-pine" x="36" y="196" width="31" height="81"/>
    <use href="#lake-pine" x="89" y="186" width="33" height="87"/>
    <use href="#lake-pine" x="366" y="178" width="41" height="108"/>
    <use href="#lake-pine" x="398" y="204" width="29" height="75"/>
  </g>

