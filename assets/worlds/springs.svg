<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" width="430" height="932" role="img" aria-label="Moonlit hot springs world">
  <defs>
    <linearGradient id="springs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08182c"/>
      <stop offset="0.48" stop-color="#24465b"/>
      <stop offset="1" stop-color="#0c706e"/>
    </linearGradient>
    <radialGradient id="springs-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8d2"/>
      <stop offset="0.72" stop-color="#ffc876"/>
      <stop offset="1" stop-color="#ff9f5b"/>
    </radialGradient>
    <linearGradient id="springs-water" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#57d9cf"/>
      <stop offset="0.45" stop-color="#138f94"/>
      <stop offset="1" stop-color="#063f55"/>
    </linearGradient>
    <linearGradient id="springs-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#756652"/>
      <stop offset="0.48" stop-color="#3e4a47"/>
      <stop offset="1" stop-color="#172e37"/>
    </linearGradient>
    <linearGradient id="springs-mineral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.4" stop-color="#d8d5a3"/>
      <stop offset="0.72" stop-color="#71c7b1"/>
      <stop offset="1" stop-color="#228c87"/>
    </linearGradient>
    <linearGradient id="springs-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b3d2b"/>
      <stop offset="1" stop-color="#2b1b25"/>
    </linearGradient>
    <radialGradient id="springs-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffbd7"/>
      <stop offset="0.35" stop-color="#ffbd43"/>
      <stop offset="1" stop-color="#ff822d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="springs-vignette" cx="50%" cy="44%" r="75%">
      <stop offset="0.5" stop-color="#071820" stop-opacity="0"/>
      <stop offset="1" stop-color="#030810" stop-opacity=".72"/>
    </radialGradient>
    <symbol id="springs-lantern" viewBox="0 0 28 54">
      <circle cx="14" cy="24" r="24" fill="url(#springs-glow)" opacity=".6"/>
      <path d="M7 13h14v24H7z" fill="#3d2625"/>
      <rect x="10" y="17" width="8" height="14" rx="2" fill="#ffd76d"/>
      <path d="m5 13 9-8 9 8M14 37v17" fill="none" stroke="#2c2021" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <symbol id="springs-maple" viewBox="0 0 38 40">
      <path d="m19 1 4 9 8-5-2 10 8 2-8 5 4 8-10-2-4 10-4-10-10 2 4-8-8-5 8-2L7 5l8 5Z" fill="#e84d33"/>
      <path d="M19 22v18" stroke="#963323" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="430" height="932" fill="url(#springs-sky)"/>
  <path d="M-18 187Q215-45 448 187" fill="none" stroke="#c8f8ff" stroke-opacity=".27" stroke-width="7"/>
  <path d="M2 164Q215-27 428 164" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="285" cy="139" r="35" fill="url(#springs-moon)" opacity=".85"/>
  <g fill="#e4f9ff" opacity=".8"><circle cx="46" cy="77" r="1.2"/><circle cx="98" cy="121" r="1.4"/><circle cx="159" cy="68" r="1"/><circle cx="337" cy="78" r="1.5"/><circle cx="393" cy="119" r="1"/></g>
  <path d="M0 270 79 160l61 99 67-141 70 137 61-108 92 120v91H0Z" fill="#152d3c" opacity=".86"/>
  <path d="m54 198 25-38 24 39-22-16ZM180 174l27-56 28 57-30-27ZM316 185l22-38 30 39-28-19Z" fill="#dbeaf0" opacity=".68"/>
  <path d="M0 283Q62 250 137 273T276 270T430 278v152H0Z" fill="#223f45"/>

  <!-- Glowing bathhouse destination -->
  <g>
    <path d="M286 212q68-22 144 4v105H281Z" fill="url(#springs-rock)"/>
    <path d="M285 208q68-24 145 2l-8 20q-64-16-137 1Z" fill="url(#springs-mineral)"/>
    <path d="M306 165h94v80h-94z" fill="url(#springs-wood)"/>
    <path d="m293 173 60-45 62 45-12 12-50-36-49 36Z" fill="#281d24"/>
    <path d="m292 168 61-45 63 45-16 1-47-30-47 31Z" fill="#e8e9d5"/>
    <path d="M317 182h20v24h-20zm53 0h20v24h-20z" fill="#ffce69"/>
    <path d="M345 181h19v64h-19z" fill="#382226"/>
    <path d="M317 194h20M370 194h20M327 182v24M380 182v24" stroke="#fff0b5" stroke-opacity=".45"/>
    <circle cx="327" cy="195" r="34" fill="url(#springs-glow)" opacity=".25"/>
    <circle cx="380" cy="195" r="34" fill="url(#springs-glow)" opacity=".25"/>
    <path d="M321 158q8-12 0-25M338 151q8-12 1-24M384 153q8-13 0-26" fill="none" stroke="#efffff" stroke-opacity=".38" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Open mineral-water corridor -->
  <path d="M145 255c34 36 53 73 36 121-25 71-86 141-99 244-12 100 15 211 43 312h234c-25-98-13-196 0-289 15-106 0-201-53-278-36-52-23-84 21-111Z" fill="url(#springs-water)"/>
  <path d="M178 284c19 39 17 75-1 114-38 80-70 159-70 250 0 101 25 189 43 284" fill="none" stroke="#b8fff1" stroke-opacity=".2" stroke-width="3"/>
  <path d="M299 283c-25 49-21 95 8 145 38 66 47 148 36 236-13 100-14 181 0 268" fill="none" stroke="#d4fff5" stroke-opacity=".15" stroke-width="2"/>
  <g fill="none" stroke="#c9fff5" stroke-opacity=".2">
    <path d="M122 454q96 22 202-4"/><path d="M92 608q127 25 255-4"/><path d="M101 788q129 22 248-4"/>
  </g>
  <g fill="#f5ffff" opacity=".12">
    <path d="M148 399q-20 22 0 42t0 42q-33-31-7-65 13-17 7-19Z"/>
    <path d="M299 489q-22 25 1 48t-2 48q-35-34-7-73 14-18 8-23Z"/>
    <path d="M184 685q-24 26 1 49t-3 50q-37-35-8-74 15-20 10-25Z"/>
  </g>

  <!-- Layered mineral terraces and waterfall at the left edge -->
  <path d="M0 249q66-30 137-2l-4 118-45 121L0 518Z" fill="url(#springs-rock)"/>
  <path d="M0 245q72-34 143-3l-17 25q-63-18-126 8Z" fill="url(#springs-mineral)"/>
  <path d="M35 272h83l-8 57H27Z" fill="#56d8ca" opacity=".72"/>
  <path d="M21 327q52 17 100-3l-11 23q-44 18-92 0Z" fill="#dcd7a5"/>
  <path d="M21 343h89l-7 63H10Z" fill="#37b6af" opacity=".7"/>
  <path d="M41 274v48m21-47v49m28-48v48M31 349v51m27-47v48m31-54v53" stroke="#d8fff2" stroke-opacity=".58" stroke-width="4" stroke-linecap="round"/>

  <!-- Right rock garden -->
  <path d="M356 298q40-23 74-13v337l-88-13-28-99 25-113Z" fill="url(#springs-rock)"/>
  <path d="M343 308q48-32 87-21v26q-39-7-82 25Z" fill="url(#springs-mineral)"/>
  <path d="M376 316c-4 37 5 65 26 88" fill="none" stroke="#8de7d6" stroke-opacity=".65" stroke-width="6"/>
  <use href="#springs-lantern" x="386" y="266" width="31" height="60"/>

  <!-- Maple branches frame the route without crossing it -->
  <path d="M0 188q59 17 96 80M7 117q27 61 98 95M430 341q-54 10-92 71M430 249q-54 29-87 78" fill="none" stroke="#4a2828" stroke-width="12" stroke-linecap="round"/>
  <g>
    <use href="#springs-maple" x="3" y="121" width="47" height="49"/>
    <use href="#springs-maple" x="38" y="155" width="39" height="41"/>
    <use href="#springs-maple" x="68" y="197" width="45" height="47"/>
    <use href="#springs-maple" x="1" y="196" width="38" height="40"/>
    <use href="#springs-maple" x="383" y="268" width="46" height="48"/>
    <use href="#springs-maple" x="351" y="315" width="41" height="43"/>
    <use href="#springs-maple" x="397" y="356" width="37" height="39"/>
  </g>

  <!-- Foreground stone gardens -->
  <path d="M0 594q50-24 98 17L80 932H0Z" fill="url(#springs-rock)"/>
  <path d="M0 590q53-26 103 14l-16 25q-42-27-87-5Z" fill="url(#springs-mineral)"/>
  <path d="M430 595q-54-25-101 21l20 316h81Z" fill="url(#springs-rock)"/>
  <path d="M430 589q-58-23-106 19l16 28q44-30 90-9Z" fill="url(#springs-mineral)"/>
  <use href="#springs-lantern" x="25" y="679" width="40" height="78"/>
  <use href="#springs-lantern" x="365" y="739" width="43" height="83"/>
  <g opacity=".9">
    <use href="#springs-maple" x="0" y="520" width="55" height="58"/>
    <use href="#springs-maple" x="45" y="570" width="41" height="43"/>
    <use href="#springs-maple" x="379" y="544" width="52" height="55"/>
    <use href="#springs-maple" x="344" y="608" width="39" height="41"/>
  </g>
  <g fill="#d94a31" opacity=".7">
    <path d="m73 459 7 8-11 2Z"/><path d="m337 531 9 5-9 5Z"/><path d="m73 754 11 2-7 9Z"/><path d="m321 820 9 7-11 3Z"/>
  </g>
  <path d="M0 875q67-33 133 3c61 33 111 33 165 2 46-27 90-29 132-8v60H0Z" fill="#ddf1e5" opacity=".52"/>
  <path d="M0 904q80-26 149 5c58 26 106 21 154-3 48-24 88-18 127-4v30H0Z" fill="#75b8a9" opacity=".48"/>
  <rect width="430" height="932" fill="url(#springs-vignette)" pointer-events="none"/>
</svg>
