  <g>
    <path d="M11 267h66v19H11Zm10 19h46v128H21Z" fill="#181d27"/>
    <path d="M20 305h48" stroke="#65707e" stroke-width="6"/>
    <path d="M353 254h67v19h-67Zm11 19h45v133h-45Z" fill="#171c26"/>
    <path d="M363 292h47" stroke="#65707e" stroke-width="6"/>
    <path d="M47 270v-48h16v48m304-11v-53h16v53" fill="none" stroke="#10151e" stroke-width="9"/>
    <circle cx="55" cy="216" r="13" fill="#31414d" stroke="#61d5df" stroke-width="3"/>
    <circle cx="375" cy="201" r="13" fill="#31414d" stroke="#61d5df" stroke-width="3"/>
    <path d="M0 737 37 657l25 49 30-105 19 129-23 202H0Zm430 0-38-96-24 57-31-111-13 149 18 196h88Z" fill="#0a0e17"/>
    <path d="m14 694 23-37 10 45m369-1-24-60-9 58" fill="none" stroke="#4f5a65" stroke-width="3" opacity=".55"/>
  </g>

  <!-- Ember moths remain peripheral. -->
  <g fill="#ffbe48" opacity=".8">
    <ellipse cx="50" cy="538" rx="6" ry="3" transform="rotate(-28 50 538)"/><ellipse cx="62" cy="536" rx="6" ry="3" transform="rotate(25 62 536)"/>
    <ellipse cx="378" cy="560" rx="6" ry="3" transform="rotate(-22 378 560)"/><ellipse cx="390" cy="559" rx="6" ry="3" transform="rotate(28 390 559)"/>
    <circle cx="56" cy="537" r="2"/><circle cx="384" cy="559" r="2"/>
