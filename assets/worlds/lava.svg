  <g fill="#e8fbff" opacity=".58">
    <circle cx="190" cy="159" r="2"/><circle cx="248" cy="143" r="1.5"/><circle cx="272" cy="210" r="2"/><circle cx="157" cy="218" r="1.5"/>
  </g>
</svg>
